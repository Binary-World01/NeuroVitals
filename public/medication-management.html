<!DOCTYPE html>
<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Neuro-Vitals | Medication Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@300;400;500;600;700;800;900&family=Poppins:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/utils.js"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ec5b13",
                        "accent-blue": "#00d2ff",
                        "background-dark": "#0a0604",
                        "neuro-green": "#10b981",
                        "neuro-red": "#ef4444",
                    },
                    fontFamily: {
                        "sans": ["Public Sans", "sans-serif"],
                        "display": ["Poppins", "sans-serif"]
                    }
                }
            }
        };
    </script>
    <style>
        body {
            font-family: 'Public Sans', sans-serif;
            background-color: #0a0604;
            background-image: radial-gradient(circle at top right, #2d1b15, #0a0604, #0a0604);
            color: #f8fafc;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .medication-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .medication-card:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(236, 91, 19, 0.3);
        }

        input, select, textarea {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: white !important;
        }

        input:focus {
            border-color: #ec5b13 !important;
            outline: none;
            box-shadow: 0 0 0 2px rgba(236, 91, 19, 0.2);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            animation: fadeIn 0.5s ease forwards;
        }
    </style>
</head>

<body class="antialiased min-h-screen flex flex-col md:flex-row">
    <!-- Sidebar -->
    <aside class="w-full md:w-20 lg:w-64 bg-background-dark/95 border-r border-white/5 flex flex-col">
        <div class="p-6 flex items-center gap-3">
            <div class="w-8 h-8 rounded-xl bg-primary/20 flex items-center justify-center text-primary">
                <span class="material-symbols-rounded">neurology</span>
            </div>
            <span class="font-bold text-lg md:hidden lg:block">Neuro-Vitals</span>
        </div>
        <nav class="flex-1 px-3 space-y-2">
            <a href="dashboard.html" class="flex items-center gap-3 px-3 py-3 rounded-xl text-slate-400 hover:bg-white/5 hover:text-white transition-colors">
                <span class="material-symbols-rounded">grid_view</span>
                <span class="md:hidden lg:block text-sm">Dashboard</span>
            </a>
            <a href="medication-management.html" class="flex items-center gap-3 px-3 py-3 rounded-xl bg-primary/10 text-primary border border-primary/20 font-medium">
                <span class="material-symbols-rounded">medication</span>
                <span class="md:hidden lg:block text-sm">Medications</span>
            </a>
            <a href="symptom-analysis.html" class="flex items-center gap-3 px-3 py-3 rounded-xl text-slate-400 hover:bg-white/5 hover:text-white transition-colors">
                <span class="material-symbols-rounded">health_metrics</span>
                <span class="md:hidden lg:block text-sm">Analysis</span>
            </a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-8 overflow-y-auto">
        <header class="mb-12 flex justify-between items-end">
            <div>
                <h1 class="font-display font-bold text-4xl text-white mb-2">Medication Management</h1>
                <p class="text-slate-400">Track and schedule your prescriptions with AI-powered insights.</p>
            </div>
            <div class="flex gap-4">
                <label class="px-6 py-3 rounded-2xl bg-white/5 border border-white/10 text-white font-bold cursor-pointer hover:bg-white/10 transition-all flex items-center gap-2">
                    <span class="material-symbols-rounded">neurology_search</span>
                    Smart Scan
                    <input type="file" class="hidden" accept="image/*" onchange="handleSmartScan(event)">
                </label>
                <button onclick="toggleModal('addModal', true)" class="px-6 py-3 rounded-2xl bg-primary text-white font-bold shadow-lg shadow-primary/20 hover:scale-[1.05] transition-all flex items-center gap-2">
                    <span class="material-symbols-rounded">add</span>
                    Add Medication
                </button>
            </div>
        </header>

        <div id="medList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Medication items will be injected here -->
            <div class="col-span-full flex flex-col items-center justify-center p-20 opacity-50">
                <span class="material-symbols-rounded text-6xl mb-4">medication</span>
                <p>Loading your profile...</p>
            </div>
        </div>

        <!-- Add Medication Modal -->
        <div id="addModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
            <div class="glass-panel w-full max-w-lg rounded-[2.5rem] p-8 relative animate-fade-in shadow-2xl">
                <button onclick="toggleModal('addModal', false)" class="absolute top-6 right-6 text-slate-400 hover:text-white">
                    <span class="material-symbols-rounded">close</span>
                </button>
                <h2 class="text-2xl font-display font-bold text-white mb-6">New Prescription</h2>
                <form id="addForm" class="space-y-4">
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-2 px-1">Medication Name</label>
                        <input type="text" name="name" id="medName" required placeholder="e.g. Lisinopril" class="w-full px-4 py-3 rounded-2xl">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-2 px-1">Dosage</label>
                            <input type="text" name="dosage" id="medDosage" placeholder="e.g. 10mg" class="w-full px-4 py-3 rounded-2xl">
                        </div>
                        <div>
                            <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-2 px-1">Frequency</label>
                            <input type="text" name="frequency" id="medFrequency" placeholder="e.g. Daily" class="w-full px-4 py-3 rounded-2xl">
                        </div>
                    </div>
                    <div>
                        <label class="text-[10px] font-bold text-slate-500 uppercase tracking-widest block mb-2 px-1">Schedule (Comma separated times)</label>
                        <input type="text" name="times" id="medTimes" placeholder="08:00, 20:00" class="w-full px-4 py-3 rounded-2xl">
                    </div>
                    <button type="submit" class="w-full py-4 rounded-2xl bg-primary text-white font-bold mt-4 hover:scale-[1.02] transition-transform shadow-lg shadow-primary/20">
                        Register Medication
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script>
        const API_URL = window.getApiBase() + "/medications";
        const currentUser = JSON.parse(localStorage.getItem('neurovitals_currentUser'));

        if (!currentUser) window.location.href = 'index.html';

        async function fetchMedications() {
            try {
                const response = await fetch(`${API_URL}/${currentUser.email}`);
                const data = await response.json();
                renderMedications(data);
            } catch (err) {
                console.error("Fetch failed:", err);
            }
        }

        function renderMedications(meds) {
            const list = document.getElementById('medList');
            if (meds.length === 0) {
                list.innerHTML = `
                    <div class="col-span-full border border-dashed border-white/10 rounded-3xl p-12 text-center text-slate-500">
                        <span class="material-symbols-rounded text-4xl mb-4">inventory_2</span>
                        <p class="font-medium text-sm">No medications registered for this profile.</p>
                        <button onclick="toggleModal('addModal', true)" class="mt-4 text-primary text-xs font-bold uppercase tracking-widest">Add your first Rx</button>
                    </div>`;
                return;
            }

            list.innerHTML = meds.map(med => `
                <div class="glass-panel medication-card rounded-[2rem] p-6 border border-white/10 relative overflow-hidden group">
                    <div class="absolute -top-12 -right-12 w-24 h-24 bg-primary/5 rounded-full blur-2xl group-hover:bg-primary/10 transition-colors"></div>
                    
                    <div class="flex items-start justify-between mb-4 relative z-10">
                        <div class="w-12 h-12 rounded-2xl bg-primary/10 flex items-center justify-center text-primary border border-primary/20">
                            <span class="material-symbols-rounded text-2xl">pill</span>
                        </div>
                        <button onclick="deleteMedication('${med.id}')" class="text-slate-600 hover:text-red-400 transition-colors">
                            <span class="material-symbols-rounded text-xl">delete</span>
                        </button>
                    </div>

                    <h3 class="text-xl font-bold text-white mb-1">${med.name}</h3>
                    <p class="text-xs text-primary font-bold uppercase tracking-widest mb-4">${med.dosage || 'No dosage specified'}</p>
                    
                    <div class="space-y-3">
                        <div class="flex items-center gap-3 text-slate-400">
                            <span class="material-symbols-rounded text-sm">event_repeat</span>
                            <span class="text-xs font-medium">${med.frequency || 'N/A'}</span>
                        </div>
                        <div class="flex items-center gap-3 text-slate-400">
                            <span class="material-symbols-rounded text-sm">schedule</span>
                            <span class="text-xs font-medium">${med.time_of_day?.join(', ') || 'As needed'}</span>
                        </div>
                    </div>

                    <div class="mt-6 flex items-center justify-between pt-4 border-t border-white/5">
                        <button onclick="toggleMedicationStatus('${med.id}')" class="flex items-center gap-2 text-[10px] font-black uppercase tracking-tighter ${med.is_active ? 'text-neuro-green' : 'text-slate-500'} hover:opacity-80 transition-opacity">
                            <span class="w-1.5 h-1.5 rounded-full ${med.is_active ? 'bg-neuro-green animate-pulse' : 'bg-slate-500'}"></span>
                            ${med.is_active ? 'Active Protocol' : 'Paused'}
                        </button>
                        <button class="text-[10px] font-bold text-slate-500 hover:text-white underline uppercase">View History</button>
                    </div>
                </div>
            `).join('');
        }

        async function deleteMedication(id) {
            if (!confirm("Remove this medication?")) return;
            try {
                const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
                if (res.ok) fetchMedications();
            } catch (err) {
                console.error("Delete failed:", err);
            }
        }

        async function toggleMedicationStatus(id) {
            // This would ideally be a PATCH request, but we'll implement it as a fetch/save for the demo
            showToast('Updating protocol status...', 'info');
            try {
                // In a real app, we'd hit a dedicated toggle endpoint
                // For now, we'll just show the visual feedback or fetch/update
                fetchMedications(); 
            } catch (err) {
                console.error("Toggle failed:", err);
            }
        }

        async function addMedication(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const times = formData.get('times').split(',').map(t => t.trim()).filter(t => t);
            
            const payload = {
                name: formData.get('name'),
                dosage: formData.get('dosage'),
                frequency: formData.get('frequency'),
                time_of_day: times,
                is_active: true
            };

            try {
                const res = await fetch(`${API_URL}/?user_email=${currentUser.email}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                if (res.ok) {
                    toggleModal('addModal', false);
                    e.target.reset();
                    fetchMedications();
                }
            } catch (err) {
                console.error("Add failed:", err);
            }
        }

        async function handleSmartScan(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            showToast('AI extracting prescription data...', 'info');
            
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(`${API_URL}/scan`, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('AI Scan failed');

                const data = await response.json();
                
                // Open modal if closed
                toggleModal('addModal', true);
                
                // Populate form fields
                document.getElementById('medName').value = data.name || '';
                document.getElementById('medDosage').value = data.dosage || '';
                document.getElementById('medFrequency').value = data.frequency || '';
                // Map time_of_day to times input
                document.getElementById('medTimes').value = data.time_of_day || '';
                
                showToast(`Scan complete: Extracted ${data.name}`, 'success');
            } catch (error) {
                console.error('Scan Error:', error);
                showToast('AI Scan failed. Please enter manually.', 'error');
            }
        }

        function toggleModal(id, show) {
            const modal = document.getElementById(id);
            modal.classList.toggle('hidden', !show);
            if (show) modal.classList.add('flex');
            else modal.classList.remove('flex');
        }

        document.getElementById('addForm').addEventListener('submit', addMedication);
        fetchMedications();
    </script>
</body>

</html>
